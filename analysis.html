/* ============================================================
   数据门户 · 原型优化 — 设计令牌
   优化方向：单一品牌蓝 + 克制中性灰，统一圆角/阴影/间距，
   去除拼接式渐变 banner，统一「图标方块」视觉语言。
   ============================================================ */
:root{
  /* 品牌 / 功能色 */
  --brand:#2468f2;
  --brand-600:#1f5be0;
  --brand-700:#1b4ec2;
  --brand-50:#eef4ff;
  --brand-100:#dde9ff;
  --brand-tint:#f4f8ff;

  --red:#e0492f;       --red-50:#fdeeeb;
  --amber:#e07d02;     --amber-50:#fef6e7;
  --green:#1c9e4b;     --green-50:#e8f7ee;
  --purple:#7c5cff;    --purple-50:#f0ecff;
  --cyan:#0e9bbd;      --cyan-50:#e6f6fa;

  /* 中性 */
  --ink:#0f1928;
  --g1:#1f2a3a;
  --g2:#3a4759;
  --g3:#5a6779;
  --g4:#8a94a3;
  --g5:#aab2be;
  --g6:#d6dbe2;
  --line:#e9edf2;
  --line-soft:#f0f3f7;
  --bg:#f4f6f9;
  --bg-2:#eef1f5;
  --card:#ffffff;

  /* 圆角 */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;

  /* 阴影 */
  --sh-1:0 1px 2px rgba(15,25,40,.04);
  --sh-2:0 4px 14px rgba(15,25,40,.07);
  --sh-3:0 10px 30px rgba(15,25,40,.10);

  /* 间距基准 4px */
  --gutter:32px;
  --maxw:1440px;

  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box;}
html{scrollbar-gutter:stable;overflow-y:scroll;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  color:var(--g1);
  background:
    url("_assets/bg.png") top center / 100% auto no-repeat fixed;
  background-color:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-size:14px;
  line-height:1.55;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
::selection{background:var(--brand-100);}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}

/* 滚动条 */
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:#d7dde5;border-radius:8px;border:2px solid transparent;background-clip:content-box;}
*::-webkit-scrollbar-thumb:hover{background:#c2cad4;background-clip:content-box;}
*::-webkit-scrollbar-track{background:transparent;}

/* 悬浮显示滚动条 */
.hover-scroll{scrollbar-width:thin;scrollbar-color:transparent transparent;}
.hover-scroll::-webkit-scrollbar-thumb{background:transparent;}
.hover-scroll:hover{scrollbar-color:#cdd4dd transparent;}
.hover-scroll:hover::-webkit-scrollbar-thumb{background:#cdd4dd;}

/* 通用容器 */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);}

/* 卡片 */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-1);
}

/* 文本工具 */
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.muted{color:var(--g4);}

/* 入场动画（仅在允许动效时启用，避免打印/降级时内容不可见） */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.fade-up{}
@media (prefers-reduced-motion: no-preference){
  .fade-up{animation:fadeUp .32s cubic-bezier(.2,0,0,1) both;}
}

/* 分页/按钮基础 */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--r-sm);font-weight:500;font-size:14px;transition:.15s;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-600);}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--g2);}
.btn-ghost:hover{border-color:var(--g6);background:var(--bg);}

/* 悬浮提示（替代原生 title，响应更快、样式统一） */
.tip-host{position:relative;}
.tip{
  position:absolute;z-index:60;opacity:0;visibility:hidden;
  transition:opacity .12s ease,visibility .12s ease;pointer-events:none;
  background:rgba(15,25,40,.94);color:#fff;font-size:12.5px;line-height:1.6;font-weight:400;
  padding:8px 11px;border-radius:8px;box-shadow:var(--sh-3);-webkit-font-smoothing:antialiased;
}
.tip-host:hover>.tip{opacity:1;visibility:visible;transition-delay:.02s;}
.tip-block{top:100%;left:0;right:0;margin-top:8px;white-space:normal;text-align:left;}
.tip-mini{bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;white-space:nowrap;}


  @keyframes d-spin{to{transform:rotate(360deg);}}
  .d-spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--brand-100);border-top-color:var(--brand);animation:d-spin .7s linear infinite;}

</style>

/* 找到最近的可滚动祖先 */
function getScrollParentAn(el) {
  let p = el && el.parentElement;
  while (p) {
    const oy = getComputedStyle(p).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && p.scrollHeight > p.clientHeight) return p;
    p = p.parentElement;
  }
  return window;
}

    </header>);

}

/* ============ 内容区搜索框（逻辑同优化版：历史下拉 + 回车/点选提交） ============ */
function DSearch({ onSearch }) {
  const [q, setQ] = useStateD('');
  const [openHist, setOpenHist] = useStateD(false);
  const [hist, setHist] = useStateD(DATA.HISTORY);
  const wrapRef = useRefD(null);
  useEffectD(() => {
    const h = (e) => {if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpenHist(false);};
    document.addEventListener('mousedown', h);return () => document.removeEventListener('mousedown', h);
  }, []);
  const go = (v) => {setOpenHist(false);onSearch(v);};
  const pick = (h) => {setQ(h);setOpenHist(false);onSearch(h);};
  return (
    <div ref={wrapRef} style={{ position: 'relative', width: 400, flexShrink: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, height: 36, borderRadius: 8, background: '#fff', border: '1px solid ' + (openHist ? 'var(--brand)' : 'var(--line)'), padding: '0 12px', transition: '.14s', justifyContent: "flex-end", width: "400px" }}>
        <Icon name="search" size={16} style={{ color: 'var(--g4)', flexShrink: 0 }} />
        <input value={q} onChange={(e) => setQ(e.target.value)} onFocus={() => setOpenHist(true)} onClick={() => setOpenHist(true)}
        onKeyDown={(e) => {if (e.key === 'Enter') go(q);}}
        placeholder="请输入关键字搜索"
        style={{ flex: 1, minWidth: 0, border: 'none', background: 'transparent', outline: 'none', fontSize: 13.5, color: 'var(--g1)' }} />
        {q && <button onMouseDown={(e) => {e.preventDefault();setQ('');go('');}} title="清除" style={{ display: 'flex', color: 'var(--g5)' }}><Icon name="close" size={14} /></button>}
      </div>
      {openHist && hist.length > 0 &&
      <div className="fade-up" style={{ position: 'absolute', top: 'calc(100% + 8px)', left: 0, right: 0, zIndex: 30, background: '#fff', borderRadius: 12, border: '1px solid var(--line)', boxShadow: 'var(--sh-3)', padding: '10px 8px', textAlign: 'left' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '2px 10px 8px' }}>
            <span style={{ fontSize: 12.5, color: 'var(--g4)' }}>历史搜索</span>
            <button title="清空历史搜索" onMouseDown={(e) => {e.preventDefault();setHist([]);}} style={{ fontSize: 12.5, color: 'var(--g4)', display: 'flex' }}><Icon name="trash" size={14} /></button>
          </div>
          {hist.map((h) => <button key={h} onMouseDown={(e) => {e.preventDefault();pick(h);}} style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', padding: '9px 10px', borderRadius: 8, color: 'var(--g2)', fontSize: 14, textAlign: 'left' }}
        onMouseEnter={(e) => e.currentTarget.style.background = 'var(--bg)'} onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
            <Icon name="clock" size={15} style={{ color: 'var(--g5)', flexShrink: 0 }} /><span>{h}</span></button>)}
        </div>
      }
    </div>);

}

/* 目录分类 → 数据主题映射（目录点击 / 芯片点击共用同一 theme 状态） */
const THEME_FILTER_MAP = {
  '业务领域': ['方特支付','方特旅游','方特动漫'],
  '核心业务': ['商业系统'],
  '运营支持': ['设计院','人力资源'],
  '方特支付': ['方特支付'], '方特旅游': ['方特旅游'], '方特动漫': ['方特动漫'],
  '用户中心': ['商业系统'], '财务中心': ['商业系统'],
  '商业运营': ['商业系统'], '设计院': ['设计院'], '人力资源': ['人力资源'],
};

function AssetsBody({ onOpen, toast }) {
  const [scope, setScope] = useStateD('all');
  const [theme, setTheme] = useStateD('');
  const [view, setView] = useStateD('card');
  const [q, setQ] = useStateD('');
  const onAnalyze = () => toast && toast('正在跳转至 BI 分析平台…');
  const [favs, setFavs] = useStateD(() => Object.fromEntries(DATA.ASSETS.map((a) => [a.id, a.fav])));
  const onFav = (id) => setFavs((f) => ({ ...f, [id]: !f[id] }));
  const list = useMemoD(() => DATA.ASSETS.filter((a) => {
    if (theme) { const allowed = THEME_FILTER_MAP[theme] || [theme]; if (!allowed.includes(a.theme)) return false; }
    if (scope === 'perm' && !a.mine) return false;
    if (scope === 'fav' && !favs[a.id]) return false;
    if (q && (a.name + a.en + a.desc).toLowerCase().indexOf(q.toLowerCase()) < 0) return false;
    return true;
  }).map((a) => ({ ...a, fav: favs[a.id] })), [theme, scope, favs, q]);
  const counts = { all: DATA.ASSETS.length, perm: DATA.ASSETS.filter((a) => a.mine).length, fav: Object.values(favs).filter(Boolean).length };

  /* 滚动加载 */
  const BATCH = 8;
  const [visN, setVisN] = useStateD(BATCH);
  const [loading, setLoading] = useStateD(false);
  const scrollRef = useRefD(null);
  useEffectD(() => {setVisN(BATCH);if (scrollRef.current) scrollRef.current.scrollTop = 0;}, [scope, theme, view, q]);
  const visible = list.slice(0, visN);
  const hasMore = visN < list.length;
  const onScroll = (e) => {
    if (loading || !hasMore) return;
    const el = e.currentTarget;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 90) {
      setLoading(true);
      setTimeout(() => {setVisN((n) => Math.min(n + BATCH, list.length));setLoading(false);}, 480);
    }
  };
  /* 内容未铺满时自动补足，保证出现可滚动区域后再由滚动驱动加载 */
  useEffectD(() => {
    const el = scrollRef.current;if (!el || !hasMore) return;
    if (el.scrollHeight <= el.clientHeight + 4) {
      const t = setTimeout(() => setVisN((n) => Math.min(n + BATCH, list.length)), 280);
      return () => clearTimeout(t);
    }
  }, [visN, hasMore, list.length, view]);

  return (
    <div style={{ flex: 1, minHeight: 0, display: 'flex', gap: 20, alignItems: 'stretch', padding: '8px 36px 24px' }}>
        <CatalogTree theme={theme} setTheme={setTheme} onPickTable={setQ} matchHeight="100%" onMetric={() => {}} />
        <section className="card" style={{ flex: 1, minWidth: 0, padding: '12px 22px 18px', border: 'none', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          <FilterBar scope={scope} setScope={setScope} theme={theme} setTheme={setTheme} view={view} setView={setView} counts={counts} bleed={22} rightSlot={<DSearch onSearch={setQ} />} />
          <div ref={scrollRef} onScroll={onScroll} className="hover-scroll" style={{ flex: 1, minHeight: 0, overflowY: 'auto', marginRight: -22, paddingRight: 22 }}>
            {view === 'card' ?
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 20 }}>
                  {visible.map((a) => <AssetCard key={a.id} a={a} onOpen={onOpen} onFav={onFav} onAnalyze={onAnalyze} />)}
                </div> :
          <React.Fragment>
                  <div style={{ position: 'sticky', top: 0, zIndex: 5, display: 'flex', alignItems: 'center', gap: 16, padding: '11px 18px', background: 'var(--bg)', border: '1px solid var(--line)', borderRadius: '12px 12px 0 0', fontSize: 12.5, fontWeight: 600, color: 'var(--g4)' }}>
                    <div style={{ width: 164, flexShrink: 0 }}>名称</div>
                    <div style={{ flex: 1, minWidth: 0 }}>描述</div>
                    <div style={{ width: 96, flexShrink: 0 }}>主题</div>
                    <div style={{ width: 90, flexShrink: 0 }}>负责人</div>
                    <div style={{ width: 150, flexShrink: 0 }}>字段 / 浏览 / 收藏</div>
                    <div style={{ width: 64, flexShrink: 0, marginLeft: 16 }}>操作</div>
                  </div>
                  <div style={{ border: '1px solid var(--line)', borderTop: 'none', borderRadius: '0 0 12px 12px', overflow: 'hidden' }}>
                    {visible.map((a) => <AssetRow key={a.id} a={a} onOpen={onOpen} onFav={onFav} onAnalyze={onAnalyze} />)}
                  </div>
                </React.Fragment>}
            {list.length === 0 && <div style={{ textAlign: 'center', padding: '60px 0', color: 'var(--g5)' }}>暂无匹配的数据资产</div>}
            {list.length > 0 &&
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9, padding: '22px 0 6px', fontSize: 13, color: 'var(--g4)' }}>
                {loading ?
            <React.Fragment><span className="d-spinner" /><span>加载中…</span></React.Fragment> :
            hasMore ?
            <span>下滑加载更多</span> :
            <span>已展示全部 {list.length} 条</span>}
              </div>
          }
          </div>
        </section>
    </div>);

}

/* ============ Toast 轻提示 ============ */
function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="fade-up" style={{ position: 'fixed', left: '50%', top: 24, transform: 'translateX(-50%)', zIndex: 80,
      background: 'rgba(15,25,40,.92)', color: '#fff', padding: '10px 18px', borderRadius: 10, fontSize: 13.5,
      boxShadow: 'var(--sh-3)', display: 'flex', alignItems: 'center', gap: 8 }}>
      <Icon name="check" size={16} style={{ color: '#5fd08a' }} />{msg}
    </div>);
}

/* ============ 应用外壳：顶栏 + 路由（资产 / 看板 / 分析 / 详情） ============ */
function AppD() {
  const [page, setPage] = useStateD(window.__PAGE || 'assets');
  const [asset, setAsset] = useStateD(null);
  const [toastMsg, setToastMsg] = useStateD('');
  const toast = (m) => {setToastMsg(m);clearTimeout(window.__t);window.__t = setTimeout(() => setToastMsg(''), 2200);};
  const nav = (p) => {setPage(p);window.scrollTo({ top: 0 });};
  const navTo = (label) => nav(label === '数据看板' ? 'boards' : label === '数据分析' ? 'analysis' : 'assets');
  const openDetail = (a) => {setAsset(a);setPage('detail');window.scrollTo({ top: 0 });};
  const navActive = page === 'boards' ? '数据看板' : page === 'analysis' ? '数据分析' : '数据资产';

  const BoardsBody = window.BoardsBody;
  if (page === 'assets' || page === 'detail' || page === 'analysis' || (page === 'boards' && BoardsBody)) {
    return (
      <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <DHeader active={navActive} onNav={navTo} />
        {page === 'assets' ?
        <AssetsBody onOpen={openDetail} toast={toast} /> :
        page === 'boards' ?
        <BoardsBody toast={toast} /> :
        page === 'analysis' ?
        <div className="hover-scroll" style={{ flex: 1, minHeight: 0, overflowY: 'auto' }}><AnalysisPage toast={toast} /></div> :
        <DetailPage asset={asset} onBack={() => nav('assets')} toast={toast} />}
        <Toast msg={toastMsg} />
      </div>);
  }
  return (
    <div style={{ minHeight: '100vh' }}>
      <DHeader active={navActive} onNav={navTo} />
      {page === 'boards' && <DashboardsPage toast={toast} />}
      <Toast msg={toastMsg} />
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppD />);
</script>
</body>
</html>
